<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Specialized Rope Braid Viewer</title>
    <style>
        /* CSS to contain the 3D viewer, not fullscreen */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff; /* Dark background to pop the copper */
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 20px; font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        /* THE 3D VIEWER CONTAINER */
        #braid-viewer-section {
            width: 80%; /* Takes 80% of page width */
            max-width: 1000px; /* But caps at 1000px */
            height: 60vh; /* Takes 60% of viewport height */
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 8px;
            position: relative; /* Context for absolute controls */
            overflow: hidden; /* Important! Keeps 3D inside */
            cursor: grab; /* Signifies rotatability */
        }
        
        #braid-viewer-section:active { cursor: grabbing; }

        /* Interface overlays */
        .viewer-control-panel {
            position: absolute;
            background: rgba(15, 23, 42, 0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none; /* Allow mouse events to pass through to 3D */
            z-index: 10;
        }
        #label-main { bottom: 15px; right: 15px; }
    </style>
</head>
<body>

    <h1></h1>

   <div id="braid-viewer-section" style="width: 100%; height: 500px; background: #fff; border-radius: 8px; overflow: hidden; cursor: grab; border: 1px solid #ddd;">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    const container = document.getElementById('braid-viewer-section');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 15, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

   // New High-Intensity Lighting
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5); 
scene.add(hemiLight);

const topLight = new THREE.DirectionalLight(0xffffff, 1.2);
topLight.position.set(5, 15, 10);
scene.add(topLight);

    // --- MATERIALS ---
    const redBraidMat = new THREE.MeshStandardMaterial({ 
        color: 0xee0000, 
        metalness: 0.5, 
        roughness: 0.4 
    });
    const silverMat = new THREE.MeshStandardMaterial({ 
    color: 0xffffff,    
    metalness: 0.8,     
    roughness: 0.3      // This "blurs" the reflection so it looks silver, not black
});

    renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.5; // Turn this up if it's still too dark

    // --- 1. SILVER ENDS WITH SQUARE HOLES ---
    function createTerminalWithHole() {
        const shape = new THREE.Shape();
        // Outer Square (Terminal Body)
        shape.moveTo(-2.25, -2.25);
        shape.lineTo(2.25, -2.25);
        shape.lineTo(2.25, 2.25);
        shape.lineTo(-2.25, 2.25);
        shape.lineTo(-2.25, -2.25);

        // Inner Square Hole
        const holePath = new THREE.Path();
        holePath.moveTo(-0.7, -0.7);
        holePath.lineTo(0.7, -0.7);
        holePath.lineTo(0.7, 0.7);
        holePath.lineTo(-0.7, 0.7);
        holePath.lineTo(-0.7, -0.7);
        shape.holes.push(holePath);

        const extrudeSettings = { depth: 0.5, bevelEnabled: false };
        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        // Rotate and center
        geometry.rotateX(Math.PI / 2); 
        return new THREE.Mesh(geometry, silverMat);
    }

    const leftTerm = createTerminalWithHole();
    leftTerm.position.set(-12, 0, 0);
    scene.add(leftTerm);

    const rightTerm = createTerminalWithHole();
    rightTerm.position.set(12, 0, 0);
    scene.add(rightTerm);

    // --- 2. THICKER TIGHT BRAID ---
    const strandCount = 20; 
    const segments = 100;
    const length = 20.5;
    const weaveTightness = 10;

    for (let i = 0; i < strandCount; i++) {
        const points = [];
        const isClockwise = i % 2 === 0; 
        const offset = (i / strandCount) * Math.PI * 2;

        for (let j = 0; j <= segments; j++) {
            const p = j / segments;
            const x = (p * length) - (length / 2);
            
            const t = Math.abs((p - 0.5) * 2); 
            
            // INCREASED THICKNESS LOGIC:
            // Base radius is 1.2 at center, expanding to 2.2 at ends
            const expansion = 1.2 + (Math.pow(t, 2) * 1.0); 
            // Height is more substantial now
            const flattening = 1.0 - (Math.pow(t, 2) * 0.4);

            const angle = (p * Math.PI * 2 * weaveTightness * (isClockwise ? 1 : -1)) + offset;
            
            const y = Math.sin(angle) * flattening;
            const z = Math.cos(angle) * expansion;

            points.push(new THREE.Vector3(x, y, z));
        }

        const curve = new THREE.CatmullRomCurve3(points);
        // Strand thickness increased to 0.25 for a "thicker" look
        const tubeGeo = new THREE.TubeGeometry(curve, 100, 0.25, 8, false);
        const strand = new THREE.Mesh(tubeGeo, redBraidMat);
        scene.add(strand);
    }

    // --- 3. RED ANNOTATION LINE ---
    const lineMat = new THREE.LineBasicMaterial({ color: 0xff0000 });
    const linePoints = [new THREE.Vector3(-10, -4.5, 0), new THREE.Vector3(10, -4.5, 0)];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
    scene.add(new THREE.Line(lineGeo, lineMat));

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
